# Lint only. CSS generation is a build-time concern, not a CI concern:
#
#   - PostCSS nesting flatten (FE-003) and the Tailwind v4 utilities (FE-006a)
#     both run in the Dockerfile's `css-builder` stage, which also verifies the
#     output is non-empty and free of leftover `&` nesting operators.
#   - `static/dist/` is generated and gitignored, so there is no artifact for
#     CI to check in.
#
# Keep this workflow to checks that read the source: adding a build step here
# would duplicate the Docker build without producing anything anyone consumes.
name: CSS Lint

on:
  push:
    branches: [main]
    paths:
      - "backend/static/**/*.css"
      - "backend/.stylelintrc.json"
      - "backend/postcss.config.cjs"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/css-lint.yml"
  pull_request:
    paths:
      - "backend/static/**/*.css"
      - "backend/.stylelintrc.json"
      - "backend/postcss.config.cjs"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/css-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: css-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install CSS tooling
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Lint CSS (correctness + nesting depth)
        working-directory: backend
        run: npm run lint:css
