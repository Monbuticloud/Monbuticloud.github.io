# Cargo configuration
# Docs: https://doc.rust-lang.org/cargo/reference/config.html

[alias]
# Common workflow aliases
check-all = "check --all-targets --all-features"
build-rel = "build --release"
test-all = "test --all-targets"
clippy-all = "clippy --all-targets --all-features -- -D warnings"
fmt-check = "fmt --check"
clean-all = "clean"
