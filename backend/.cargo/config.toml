# Platform-specific linker flags to drop unused code sections after LTO

# Linux (ELF — musl, gnu)
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-args=-Wl,--gc-sections"]

# macOS (Mach-O)
[target.'cfg(target_vendor = "apple")']
rustflags = ["-C", "link-args=-Wl,-dead_strip"]

# Windows MSVC (PE/COFF)
[target.'cfg(target_env = "msvc")']
rustflags = ["-C", "link-args=/OPT:REF"]
