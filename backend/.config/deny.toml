# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
yanked = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "AGPL-3.0",
    "AGPL-3.0-only",
]
deny = [
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-2.0",
    "GPL-2.0-only",
    "LGPL-3.0",
    "LGPL-3.0-only",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-git = []
allow-org = []
