[package]
name = "backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
mime = "0.3"
crossbeam = "0.8"
chrono = { version = "0.4", features = ["clock"] }
wide = "1.5"
mimalloc = { version = "0.1", default-features = false }
rayon = "1"
diesel = { version = "2.2", features = ["postgres"] }
diesel-async = { version = "0.5", features = ["postgres"] }
futures-util = { version = "0.3", default-features = true, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
portable-atomic = "1"
[profile.dev]
opt-level = 0
debug = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"


