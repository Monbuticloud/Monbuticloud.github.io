# DHI default locks to localhost only — allow Docker network (CR-012 fix).
# Method scram-sha-256 matches password_encryption; local uses trust for
# initdb/healthcheck convenience (matches stock postgres image behavior).

local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::0/0                   scram-sha-256
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     all             0.0.0.0/0               scram-sha-256
host    replication     all             ::0/0                   scram-sha-256
