[package]
name = "falcon-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "FALCON (FN-DSA) key generation, signing, verification — compiled to WASM"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
falcon-rs = { version = "0.2", default-features = false, features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"        # Optimize for size
lto = "fat"            # Full LTO = better dead code elimination
codegen-units = 1      # Single CGU = max optimization
panic = "abort"        # No unwinding = smaller binary
strip = "symbols"      # Strip all symbols
debug = false
