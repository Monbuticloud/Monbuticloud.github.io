# cargo-deny configuration
# Docs: https://embarkStudio.github.io/cargo-deny/
# Schema for cargo-deny 0.19.x (config v2). Anything not explicitly allowed
# is rejected — there is no separate deny list to maintain.

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "AGPL-3.0",
    "AGPL-3.0-only",
]
confidence-threshold = 0.8
exceptions = []

[bans]
# Semver-incompatible dupes from the RustCrypto 0.10/0.12 transition
# (block-buffer, cpufeatures, crypto-common) are unavoidable while sha2 0.10
# and falcon-rs coexist — warn instead of deny.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
allow-org = { github = [], gitlab = [] }
