services:
  postgres:
    restart: unless-stopped
    # Docker Hardened Image — requires `docker login dhi.io` (free).
    # PGDATA lives at /var/lib/postgresql/18/data, so the mount is the
    # PARENT dir (see docs/debugging/postgres-16-to-dhi-18.md).
    image: dhi.io/postgres:18-alpine3.23
    environment:
      POSTGRES_USER: homepage
      POSTGRES_PASSWORD: homepage
      POSTGRES_DB: homepage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/setup.sql:/docker-entrypoint-initdb.d/00-setup.sql:ro
    # DHI entrypoint invokes the postgres binary itself — pass only flags.
    command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepage -d homepage"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    restart: unless-stopped
    build:
      context: .
      dockerfile: nginx/Dockerfile.local
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_started

  pgdog:
    restart: unless-stopped
    image: ghcr.io/pgdogdev/pgdog:main
    ports:
      - "127.0.0.1:6432:6432"
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9631:9630"
    volumes:
      - ./config/pgdog/pgdog.toml:/etc/pgdog/pgdog.toml:ro
      - ./config/pgdog/users.toml:/etc/pgdog/users.toml:ro
    command: ["/usr/local/bin/pgdog", "--config", "/etc/pgdog/pgdog.toml", "--users", "/etc/pgdog/users.toml"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DATABASE_URL: "postgres://homepage:homepage@pgdog:6432/homepage"
      AUTH_HMAC_SECRET: "${AUTH_HMAC_SECRET}"
    depends_on:
      pgdog:
        condition: service_started
